name: operaton-docker-compose

services:
  operaton-database:
    container_name: operaton-docker-compose-operaton-database
    image: postgres:17.9
    ports:
      - "54320:5432"
    environment:
      POSTGRES_USER: operaton
      POSTGRES_PASSWORD: password
      POSTGRES_DB: operaton
    volumes:
      - operaton-database-data:/var/lib/postgres # persist data even if container shuts down

  operaton-keycloak:
    container_name: operaton-docker-compose-operaton-keycloak
    depends_on:
      - operaton-keycloak-database
    image: quay.io/keycloak/keycloak:26.6.0
    ports:
      - "8081:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://operaton-keycloak-database/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_FEATURES: token-exchange,admin-fine-grained-authz
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
    volumes:
      - ./imports/keycloak:/opt/keycloak/data/import
    command:
      - start-dev
      - --import-realm
      - --http-enabled=true
      - --hostname-strict=false
    healthcheck:
      test: [ 'CMD-SHELL', '[ -f /tmp/HealthCheck.java ] || echo "public class HealthCheck { public static void main(String[] args) throws java.lang.Throwable { System.exit(((java.net.HttpURLConnection)new java.net.URL(args[0]).openConnection()).getResponseCode() == 200 ? 0 : 1); } }" > /tmp/HealthCheck.java && java /tmp/HealthCheck.java http://localhost:8080/auth' ]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 5s

  operaton-keycloak-database:
    image: postgres:17.9
    container_name: operaton-docker-compose-operaton-keycloak-database
    ports:
      - "54329:5432"
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak

volumes:
  operaton-database-data:
